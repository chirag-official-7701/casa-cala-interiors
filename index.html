<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#131210" />

    <!-- Default metadata; per-route <title>/<meta> are injected by React 19. -->
    <title>Casa Kala — Interiors · Spaces · Living</title>
    <meta
      name="description"
      content="Casa Kala is an interior design studio crafting refined residential, commercial and hospitality interiors — thoughtful spaces, lasting impact, places people belong to."
    />

    <!-- Fonts: preconnect + display=swap for fast, non-blocking text render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    />

    <!-- Preconnect to the image CDN to speed up the LCP hero image. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
